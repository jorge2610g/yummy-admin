name: Robot E2E de producción
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        run: npx playwright test --config monitor/playwright.production.config.js
        env:
          ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
          RESTAURANT_TEST_EMAIL: ${{ secrets.RESTAURANT_TEST_EMAIL }}
          RESTAURANT_TEST_PASSWORD: ${{ secrets.RESTAURANT_TEST_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: production-e2e-report, path: production-report, if-no-files-found: ignore}
      - if: steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title='[Monitor] Recorrido E2E de producción falló';
            const body=`El robot no pudo completar un recorrido real.\n\nEjecución: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nCommit del monitor: \`${process.env.GITHUB_SHA}\``;
            const {data:open}=await github.rest.issues.listForRepo({...context.repo,state:'open',labels:'monitor'});
            const issue=open.find(x=>x.title===title);
            if(issue)await github.rest.issues.update({...context.repo,issue_number:issue.number,body});else await github.rest.issues.create({...context.repo,title,body,labels:['monitor']});
      - if: steps.e2e.outcome == 'failure'
        run: exit 1
