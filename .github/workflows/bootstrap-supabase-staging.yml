name: Bootstrap Supabase Staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/bootstrap-supabase-staging.yml"
      - ".staging-bootstrap-trigger"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    env:
      PROD_PROJECT_REF: gulctljitzlwokqydigx
      STAGING_PROJECT_REF: wodqqheeesrelsbacmgx
      BASELINE_FILE: supabase/migrations/20260925153000_production_baseline.sql

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Initialize migration directory
        run: mkdir -p supabase/migrations

      - name: Validate required secrets
        env:
          PROD_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STG_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          test -n "$PROD_DB_PASSWORD" || (echo "Missing GitHub secret: PRODUCTION_DB_PASSWORD" && exit 1)
          test -n "$STG_DB_PASSWORD" || (echo "Missing GitHub secret: STAGING_DB_PASSWORD" && exit 1)

      - name: Dump production public schema only
        if: ${{ hashFiles('supabase/migrations/20260925153000_production_baseline.sql') == '' }}
        env:
          PGPASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            pg_dump \
              --host="db.$PROD_PROJECT_REF.supabase.co" \
              --port=5432 \
              --username=postgres \
              --dbname=postgres \
              --schema=public \
              --schema-only \
              --no-owner \
              --no-privileges \
            > "$BASELINE_FILE"
          test -s "$BASELINE_FILE"

      - name: Commit reproducible baseline to staging
        if: ${{ hashFiles('supabase/migrations/20260925153000_production_baseline.sql') != '' }}
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase
            git commit -m "chore(staging): baseline Supabase schema from production"
            git push origin HEAD:staging
          fi

      - name: Apply public schema to YummyPro Staging
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          docker run --rm -i \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql \
              --host="db.$STAGING_PROJECT_REF.supabase.co" \
              --port=5432 \
              --username=postgres \
              --dbname=postgres \
              --set=ON_ERROR_STOP=1 \
            < "$BASELINE_FILE"
