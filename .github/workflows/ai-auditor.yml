name: Auditor IA de Pruebas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [staging]
    paths:
      - "tests/system-auditor.mjs"
      - ".github/workflows/ai-auditor.yml"
      - "index.html"
      - "VERSION"
      - ".ai-audit-trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: yummypro-ai-auditor-staging
  cancel-in-progress: true

jobs:
  ai-audit:
    name: ai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node --check tests/system-auditor.mjs
      - run: npx playwright install --with-deps chromium

      - name: Abrir, interactuar y auditar visualmente todos los módulos de Pruebas
        run: node tests/system-auditor.mjs
        env:
          ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
          # Auditor1 es la cuenta Restaurante de Staging. La contraseña compartida ya fue validada por Retail.
          RESTAURANT_TEST_EMAIL: auditor1.prueba@yummypro.test
          RESTAURANT_TEST_PASSWORD: ${{ secrets.RETAIL_TEST_PASSWORD }}
          RETAIL_TEST_EMAIL: ${{ secrets.RETAIL_TEST_EMAIL }}
          RETAIL_TEST_PASSWORD: ${{ secrets.RETAIL_TEST_PASSWORD }}
          PROFESSIONAL_TEST_EMAIL: ${{ secrets.PROFESSIONAL_TEST_EMAIL }}
          PROFESSIONAL_TEST_PASSWORD: ${{ secrets.PROFESSIONAL_TEST_PASSWORD }}
          STREAMING_TEST_EMAIL: ${{ secrets.STREAMING_TEST_EMAIL }}
          STREAMING_TEST_PASSWORD: ${{ secrets.STREAMING_TEST_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GROQ_MODEL: openai/gpt-oss-20b
          AI_AUDIT_ENFORCE: "false"

      - name: Publicar resumen en GitHub Actions
        if: always()
        run: |
          if [ -f audit-results/README.md ]; then
            cat audit-results/README.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "El auditor no llegó a generar el informe." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar capturas e informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yummypro-ai-audit-${{ github.run_id }}
          path: audit-results
          if-no-files-found: warn
          retention-days: 14
