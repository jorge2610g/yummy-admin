name: Monitor de producción
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - id: health
        continue-on-error: true
        run: node monitor/run.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: monitor-result, path: monitor-result.json}
      - name: Gestionar incidencia
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('monitor-result.json','utf8'));
            const title='[Monitor] Incidente de producción';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',labels:'monitor'});
            const current=issues.find(x=>x.title===title);
            const affected=report.services.filter(x=>x.level!=='operational');
            if(report.overall==='operational'){
              if(current){await github.rest.issues.createComment({...context.repo,issue_number:current.number,body:`✅ Recuperado automáticamente: ${report.checkedAt}`});await github.rest.issues.update({...context.repo,issue_number:current.number,state:'closed',state_reason:'completed'})}
              return;
            }
            const body=['## Estado: '+report.overall.toUpperCase(),'Detectado: `'+report.checkedAt+'`','Commit: `'+report.commit+'`','','| Servicio | Estado | HTTP | Latencia | Detalle |','|---|---:|---:|---:|---|',...affected.map(x=>`| ${x.name} | ${x.level} | ${x.httpStatus} | ${x.latencyMs} ms | ${x.message} |`),'','[Ver ejecución]('+process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID+')'].join('\n');
            if(current)await github.rest.issues.createComment({...context.repo,issue_number:current.number,body});
            else await github.rest.issues.create({...context.repo,title,body,labels:['monitor']});
      - name: Alertar por WhatsApp
        if: steps.health.outcome == 'failure'
        continue-on-error: true
        run: node monitor/send-whatsapp.mjs
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      - if: steps.health.outcome == 'failure'
        run: exit 1
