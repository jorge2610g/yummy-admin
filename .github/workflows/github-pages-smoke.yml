name: Smoke GitHub Pages Pruebas

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke de Pruebas
        run: npx playwright test tests/github-pages.spec.js --reporter=line
        env:
          PAGES_TEST_URL: https://jorge2610g.github.io/yummy-admin-pruebas/
          ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      - name: Guardar evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-smoke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
