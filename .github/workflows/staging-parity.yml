# Gate de release de Pruebas: compara invariantes con Producción y exige un checkpoint explícito
# para las diferencias intencionales de RLS/funciones que aún no fueron promovidas.
name: Verify Staging Parity

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'supabase/**'
      - 'scripts/staging-parity.sql'
      - 'scripts/staging-schema-checkpoint.txt'
      - '.github/workflows/staging-parity.yml'
      - '.ai-audit-trigger'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      PROD_PROJECT_REF: gulctljitzlwokqydigx
      STAGING_PROJECT_REF: wodqqheeesrelsbacmgx
      SUPABASE_POOLER_HOST: aws-0-sa-east-1.pooler.supabase.com

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Validate required secrets
        env:
          PROD_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STG_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          test -n "$PROD_DB_PASSWORD" || (echo "Missing GitHub secret: PRODUCTION_DB_PASSWORD" && exit 1)
          test -n "$STG_DB_PASSWORD" || (echo "Missing GitHub secret: STAGING_DB_PASSWORD" && exit 1)

      - name: Verify staging contains production history
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "staging does not contain the current main history"
            exit 1
          fi

      - name: Compare database runtime fingerprints
        env:
          PROD_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          STG_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail

          fingerprint() {
            local ref="$1"
            local password="$2"
            docker run --rm -i \
              -e PGPASSWORD="$password" \
              -e PGSSLMODE=require \
              -e PGCONNECT_TIMEOUT=15 \
              postgres:17 \
              psql \
                --host="$SUPABASE_POOLER_HOST" \
                --port=6543 \
                --username="postgres.$ref" \
                --dbname=postgres \
                --no-align \
                --tuples-only \
                --set=ON_ERROR_STOP=1 \
              < scripts/staging-parity.sql
          }

          echo "Validating Production database access..."
          prod_hash="$(fingerprint "$PROD_PROJECT_REF" "$PROD_DB_PASSWORD")" || {
            echo "ERROR: PRODUCTION_DB_PASSWORD or Production pooler connection is invalid."
            exit 2
          }

          echo "Validating Staging database access..."
          staging_hash="$(fingerprint "$STAGING_PROJECT_REF" "$STG_DB_PASSWORD")" || {
            echo "ERROR: STAGING_DB_PASSWORD or Staging pooler connection is invalid."
            exit 3
          }

          prod_hash="$(echo "$prod_hash" | tr -d '[:space:]')"
          staging_hash="$(echo "$staging_hash" | tr -d '[:space:]')"

          IFS='|' read -r -a prod_parts <<< "$prod_hash"
          IFS='|' read -r -a staging_parts <<< "$staging_hash"

          if [ "${#prod_parts[@]}" -ne 10 ] || [ "${#staging_parts[@]}" -ne 10 ]; then
            echo "ERROR: unexpected database fingerprint format."
            exit 4
          fi

          # Invariantes de infraestructura que no deben divergir silenciosamente:
          # table grants, sequence grants, default ACL, extensions y storage buckets.
          # Columnas, policies, funciones, triggers y permisos de RPC pueden diferir
          # intencionalmente en Pruebas mientras se validan migraciones; en ese caso,
          # el fingerprint COMPLETO de Staging debe coincidir con el checkpoint aprobado.
          for idx in 4 5 7 8 9; do
            if [ "${prod_parts[$idx]}" != "${staging_parts[$idx]}" ]; then
              echo "ERROR: protected infrastructure invariant $idx differs from Production."
              exit 5
            fi
          done

          expected_sha="$(awk -F= '$1=="schema_sha256" {print $2}' scripts/staging-schema-checkpoint.txt | tr -d '[:space:]')"
          test -n "$expected_sha" || (echo "ERROR: missing schema_sha256 in staging checkpoint." && exit 6)

          current_sha="$(printf '%s' "$staging_hash" | sha256sum | awk '{print $1}')"
          if [ "$current_sha" != "$expected_sha" ]; then
            echo "ERROR: untracked Staging database drift detected after the recorded checkpoint."
            echo "Expected checkpoint SHA: $expected_sha"
            echo "Current Staging SHA:     $current_sha"
            exit 7
          fi

          if [ "$prod_hash" = "$staging_hash" ]; then
            echo "OK: Staging is fully identical to Production."
          else
            echo "OK: critical invariants match Production and intentional Staging RLS/function changes match the recorded checkpoint."
          fi
